# End-to-end stack, layered over docker-compose.yml and run as its own project by `make e2e`.
# Own database, queue and bucket (in memory, gone on `down`), no published ports, and a stub
# in place of Ollama, so tests never touch dev data and never wait on a real model.
x-e2e-env: &e2e-env
  OLLAMA_HOST: http://ollama-stub:11434
  OLLAMA_TEXT_MODEL: stub
  # The PDF viewer loads signed URLs from inside the compose network
  S3_PUBLIC_ENDPOINT: http://storage:9000
  AUTO_APPROVE: "true"

services:
  web:
    ports: !reset []
    # Its own build folder: two dev servers sharing apps/web/.next on the bind mount each see
    # the other's writes as source changes and keep reloading the browser
    tmpfs:
      - /app/apps/web/.next:uid=1000,gid=1000
    environment:
      <<: *e2e-env
      NEXT_ALLOWED_DEV_ORIGINS: web
      LABELLED_SET_DIR: /tmp/labelled
    depends_on:
      ollama-stub:
        condition: service_healthy

  worker:
    environment:
      <<: *e2e-env
    depends_on:
      ollama-stub:
        condition: service_healthy

  postgres:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/var/lib/postgresql]

  redis:
    ports: !reset []
    volumes: !reset []
    tmpfs: [/data]

  storage:
    ports: !reset []
    # RustFS runs as a non-root user and cannot write to a root-owned tmpfs, so it gets an
    # anonymous volume, recreated by `up -V` and removed with the container
    volumes: !reset [/data]

  # Never started here; the stub answers instead
  ollama:
    profiles: [real-model]

  ollama-stub:
    image: node:24-bookworm-slim
    command: node /e2e/ollama-stub.mjs
    volumes:
      - ./e2e:/e2e:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:11434/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 10

  playwright:
    # Tag matches @playwright/test in package.json, so the bundled browsers fit the runner
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [test]
    user: "1000:1000"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      HOME: /tmp
      BASE_URL: http://web:8000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-locally}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me-0000}
    command: node_modules/.bin/playwright test -c e2e/playwright.config.ts
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
