x-node: &node
  build: .
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - worker_node_modules:/app/apps/worker/node_modules
    - core_node_modules:/app/packages/core/node_modules
    - pnpm_store:/pnpm/store
  environment: &node-env
    DATABASE_URL: postgres://${POSTGRES_USER:-echdyn}:${POSTGRES_PASSWORD:-echdyn}@postgres:5432/${POSTGRES_DB:-echdyn}
    TEST_DATABASE_URL: postgres://${POSTGRES_USER:-echdyn}:${POSTGRES_PASSWORD:-echdyn}@postgres:5432/${POSTGRES_DB:-echdyn}_test
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-echdyn-documents}
    TEST_S3_BUCKET: ${S3_BUCKET:-echdyn-documents}-test
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-echdyn}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-echdyn-secret}
    S3_FORCE_PATH_STYLE: "true"
    OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen3:8b}
    OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
    AUTO_APPROVE: ${AUTO_APPROVE:-true}

services:
  deps:
    <<: *node
    command: pnpm install --frozen-lockfile
    restart: "no"

  web:
    <<: *node
    command: pnpm --filter @echdyn/web dev
    environment:
      <<: *node-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-locally}
      API_TOKEN: ${API_TOKEN:-local-dev-api-token-change-me-0000}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me-00}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on: &app-deps
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *node
    # Run tsx directly (not via pnpm) under an init process so SIGTERM reaches the worker
    # and it can finish in-flight extractions before exiting
    init: true
    working_dir: /app/apps/worker
    command: node_modules/.bin/tsx watch src/index.ts
    stop_grace_period: 2m
    environment:
      <<: *node-env
      WORKER_HEALTH_PORT: "3001"
    depends_on: *app-deps
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echdyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echdyn}
      POSTGRES_DB: ${POSTGRES_DB:-echdyn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-echdyn}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-echdyn-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama:
    image: ollama/ollama:0.40.13
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # To use an NVIDIA GPU, uncomment (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  node_modules:
  web_node_modules:
  worker_node_modules:
  core_node_modules:
  pnpm_store:
  postgres_data:
  redis_data:
  storage_data:
  ollama_models:
